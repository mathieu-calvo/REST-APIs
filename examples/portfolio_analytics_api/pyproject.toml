[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-api"
version = "0.1.0"
description = "Capstone for the REST-APIs curriculum — a FastAPI service that wires every chapter together."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.30,<0.40",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "python-jose[cryptography]>=3.3,<4",
    "passlib[pbkdf2_sha256]>=1.7,<2",
    "structlog>=24.1",
    "prometheus-fastapi-instrumentator>=7.0,<8",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "slowapi>=0.1.9,<0.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
